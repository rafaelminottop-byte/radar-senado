name: Ingestão Senado

on:
  schedule:
    - cron: "17 2 * * 2-6"   # 23h17 de Brasília, seg–sex (sessões deliberativas)
  workflow_dispatch:
    inputs:
      inicio:
        description: "Data inicial AAAA-MM-DD (carga histórica). Vazio = últimos 7 dias"
        required: false

jobs:
  ingerir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ingest/requirements.txt
      - name: Rodar ingestão
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          INICIO="${{ github.event.inputs.inicio }}"
          if [ -z "$INICIO" ]; then INICIO=$(date -d '7 days ago' +%F); fi
          python ingest/ingest.py tudo --inicio "$INICIO"
